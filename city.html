<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order chat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <header class="chat-top">
    <a href="index.html" id="backLink">←</a>
    <div>
      <div id="chatTitle">Order chat</div>
      <div id="chatStatus"></div>
    </div>
  </header>

  <div id="messages"></div>

  <button id="receivedBtn" hidden>I've received my order</button>

  <form id="chatForm">
    <label class="pic-btn">
      📷
      <input type="file" id="picInput" accept="image/png,image/jpeg,image/webp" hidden>
    </label>
    <input type="text" id="msgInput" placeholder="Type a message" autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
