<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My business</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="profile">
    <img id="profilePic" class="owner-pic" alt="Business">
    <h2 id="ownerName"></h2>
    <span id="categoryTag" class="cat-tag"></span>
    <p id="ownerBio"></p>
    <p id="ratingText"></p>
  </section>

  <form id="productForm">
    <h3>Add a product</h3>
    <input type="file" id="pImg" accept="image/*" required>
    <input type="text" id="pDesc" placeholder="Description" required>
    <input type="number" id="pPrice" placeholder="Price (₦)" required>
    <button type="submit">Add product</button>
  </form>

  <div id="grid"></div>
  <div class="pager">
    <button id="prev">Previous</button>
    <span id="pageNum"></span>
    <button id="next">Next</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="owner-config.js"></script>
  <script src="owner-profile.js"></script>
</body>
</html>
