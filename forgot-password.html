<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="City Plug">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your email and we will send you a link to choose a new one.</p>

    <form id="forgot-form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required><br>

      <button type="submit" id="submit-btn">Send reset link</button>
      <div id="message"></div>
    </form>

    <p class="switch">Remembered it? <a href="login.html">Log in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
