<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Complaints | City Plug admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "DM Sans", sans-serif; background: #f6f6f4; color: #1c1c1c; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { margin: 4px 0 4px; font-size: 24px; }
  .sub { margin: 0 0 12px; color: #666; font-size: 14px; }
  #status { color: #666; font-size: 14px; margin: 12px 0; }

  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button { flex: 1; padding: 10px; border: 1px solid #d8d8d8; border-radius: 10px; background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .filters button.on { background: #1c1c1c; color: #fff; border-color: #1c1c1c; }

  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .top h2 { margin: 0; font-size: 17px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.open { background: #fff3d6; color: #8a5a00; }
  .pill.resolved { background: #dcf5e4; color: #146c36; }
  .meta { margin: 4px 0 8px; font-size: 13px; color: #666; }
  .preview { margin: 0; font-size: 14px; color: #333; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  #thread { position: fixed; inset: 0; background: #f6f6f4; display: none; flex-direction: column; z-index: 10; height: 100dvh; }
  #thread.show { display: flex; }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #e4e4e4; }
  .head button.back { border: 0; background: none; font-size: 22px; cursor: pointer; padding: 0 6px; }
  .head .info { flex: 1; min-width: 0; }
  .head strong { display: block; font-size: 16px; }
  .head span { font-size: 12px; color: #777; }
  #toggle { border: 1px solid #d8d8d8; background: #fff; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  #msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 15px; line-height: 1.35; word-wrap: break-word; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: #1c1c1c; color: #fff; border-bottom-right-radius: 4px; }
  .msg.them { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .msg .who { display: block; font-size: 12px; font-weight: 700; margin-bottom: 2px; color: #0b4a9e; }
  .msg small { display: block; margin-top: 2px; font-size: 11px; opacity: .65; text-align: right; }
  #err { padding: 0 14px; color: #b3261e; font-size: 13px; }
  #form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #e4e4e4; }
  #text { flex: 1; resize: none; border: 1px solid #ddd; border-radius: 12px; padding: 10px; font: inherit; font-size: 16px; max-height: 110px; }
  #send { border: 0; background: #1c1c1c; color: #fff; border-radius: 12px; height: 44px; padding: 0 16px; font: inherit; font-weight: 700; cursor: pointer; }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>

<main>
  <h1>Complaints</h1>
  <p class="sub">Private admin page. Newest first.</p>
  <div class="filters">
    <button type="button" data-f="all" class="on">All</button>
    <button type="button" data-f="open">Open</button>
    <button type="button" data-f="resolved">Resolved</button>
  </div>
  <p id="status">Checking access...</p>
  <div id="list"></div>
</main>

<section id="thread" aria-label="Complaint thread">
  <div class="head">
    <button type="button" class="back" id="back" aria-label="Back">&larr;</button>
    <div class="info">
      <strong id="tTitle"></strong>
      <span id="tSub"></span>
    </div>
    <button type="button" id="toggle">Mark resolved</button>
  </div>
  <div id="msgs"></div>
  <div id="err"></div>
  <form id="form">
    <textarea id="text" rows="1" maxlength="1000" placeholder="Reply to this complaint..."></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin-complaints.js"></script>
</body>
</html>
