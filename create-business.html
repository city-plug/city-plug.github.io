
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your business</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="City Plug">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
  <div class="card">
    <h1>Create your business page</h1>
    <p class="sub" id="who">Checking your login...</p>

    <form id="business-form">
      <label for="name">Business name</label>
      <input type="text" id="name" required><br>

      <label for="city">City</label>
      <select id="city" required></select><br>

      <label for="category">Category</label>
      <select id="category" required></select><br>

      <label for="description">Short description</label><br>
      <textarea id="description" rows="4" required></textarea><br>
      <label for="address">Business address</label>
      <input type="text" id="address" required><br>

      <button type="submit" id="submit-btn">Create business page</button>
      <div id="message"></div>
    </form>

    <button id="logout-btn" type="button">Log out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="create-business.js"></script>
</body>
</html>
