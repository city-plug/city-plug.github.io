<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="City Plug">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to manage your business page.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required><br>

      <label for="password">Password</label>
      <input type="password" id="password" required><br>

      <button type="submit" id="submit-btn">Log in</button>
      <div id="message"></div>
    </form>
<button type="button" id="resend-btn" style="display:none">Resend confirmation email</button>

    <p class="switch"><a href="forgot-password.html">Forgot your password?</a></p>
    <p class="switch">New here? <a href="signup.html">Create an account</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site-url.js"></script>
  <script src="config.js"></script>
  <script src="return-to.js"></script>
  <script src="login.js"></script>
</body>
</html>
