<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business | City Plug</title>
  <link rel="stylesheet" href="browse.css">
  <link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="City Plug">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
  <header>
    <h1>City Plug</h1>
    <nav id="nav"></nav>
  </header>

  <main>
    <a class="back" id="back" href="index.html">← All cities</a>
    <p id="status"></p>

    <!-- Business details and rating -->
    <section id="bizSection" hidden>
      <h2 class="title" id="bizName"></h2>
      <div class="tag" id="bizTag"></div>
      <p id="bizDesc"></p>
      <p id="bizAddress"></p>
      <a id="bizMap" target="_blank" rel="noopener" hidden>Open in Maps</a>
      <p id="msgWrap" hidden><a id="msgLink" href="#" style="display:inline-block;padding:10px 14px;background:#1f6feb;color:#fff;border-radius:8px;text-decoration:none">Message this business</a></p>


      <div class="rating-box">
        <div id="ratingSummary" class="rating-summary"></div>
        <div id="stars" class="stars"></div>
        <div id="rateMsg" class="small-msg"></div>
      </div>
    </section>

    <!-- Only the owner of this business sees this box -->
    <section id="ownerBox" class="owner-box" hidden>
      <h3>Add a product</h3>
      <form id="productForm">
        <label for="pName">Product name</label>
        <input type="text" id="pName" required>

        <label for="pDesc">Description</label>
        <textarea id="pDesc" rows="3"></textarea>

        <label for="pPrice">Price (₦)</label>
        <input type="text" id="pPrice" inputmode="decimal" placeholder="e.g. 400,000" required>

        <label for="pImage">Picture (max 3MB)</label>
        <input type="file" id="pImage" accept="image/*">

        <button type="submit" id="pBtn">Add product</button>
        <div id="pMsg" class="small-msg"></div>
      </form>
    </section>

    <!-- Only the owner sees this: where their money is paid -->
    <section id="payoutBox" class="owner-box" hidden>
      <h3>Get paid</h3>
      <p class="note">City Plug keeps 12% of each sale. The rest is paid straight to your bank account.</p>
      <div id="payoutDone" class="note" hidden></div>
      <form id="payoutForm">
        <label for="bankSelect">Bank</label>
        <select id="bankSelect" required>
          <option value="">Loading banks...</option>
        </select>

        <label for="accountNumber">Account number</label>
        <input type="text" id="accountNumber" inputmode="numeric" maxlength="10" required>
        <div id="accountName" class="small-msg"></div>

        <button type="submit" id="payoutBtn">Save payout account</button>
        <div id="payoutMsg" class="small-msg"></div>
      </form>
    </section>

    <h3 class="section-title">Products</h3>
    <p id="productsStatus"></p>
    <div id="products"></div>
    <p id="payNote" class="small-msg"></p>
  </main>

  <!-- Appears when a customer adds items -->
  <div id="payBar" class="pay-bar" hidden>
    <div>
      <div class="pay-label">Total</div>
      <div id="payTotal" class="pay-total">₦0</div>
    </div>
    <button type="button" id="payBtn">Pay now</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="pay-helper.js"></script>
  <script src="nav.js"></script>
  <script src="business-link.js"></script>
  <script src="business.js"></script>
  <script src="order-alerts.js"></script>

</body>
</html>
