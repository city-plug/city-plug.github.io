<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your business</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="signupForm">
    <h2>Create your business page</h2>
    <input type="text" id="bizName" placeholder="Business name" required>
    <textarea id="bizBio" placeholder="Short description of your business" required></textarea>
    <input type="text" id="bizCity" value="Auchi" required>
    <select id="bizCategory" required>
      <option value="">Choose a category</option>
      <option>Food</option>
      <option>Fashion/shoes</option>
      <option>Gadgets</option>
      <option>Groceries/provision</option>
      <option>Hygiene/perfumes</option>
    </select>
    <label>Profile picture</label>
    <input type="file" id="bizPic" accept="image/*" required>
    <p id="msg"></p>
    <button type="submit">Create business page</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="owner-config.js"></script>
  <script src="owner-signup.js"></script>
</body>
</html>
