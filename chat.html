<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order chat</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat.css">
  <link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="City Plug">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
  <header class="chat-top">
    <a href="javascript:history.back()" id="backLink">← Back</a>
    <div>
      <div id="chatTitle">Chat</div>
      <div id="chatStatus">Loading...</div>
    </div>
  </header>

  <div id="messages"></div>

  <button id="receivedBtn" hidden>I've received my order</button>

  <form id="chatForm" hidden>
    <label class="pic-btn">
      📷
      <input type="file" id="picInput" accept="image/png,image/jpeg,image/webp" hidden>
    </label>
    <input type="text" id="msgInput" placeholder="Type a message" autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <p class="chat-note">Private between you and this business. Links and email addresses are not allowed.</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
