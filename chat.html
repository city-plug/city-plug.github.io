<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat | City Plug</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; }
    .chat-wrap { display: flex; flex-direction: column; height: 100dvh; max-width: 600px; margin: 0 auto; background: #fff; }
    .chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; }
    .chat-head a { color: #1f6feb; text-decoration: none; font-size: 15px; }
    .chat-head h1 { font-size: 17px; margin: 0; }
    .chat-status { margin: 0; padding: 12px 16px; color: #6b7280; font-size: 14px; }
    .chat-status:empty { display: none; }
    .chat-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { display: flex; }
    .msg.mine { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 8px 12px; border-radius: 14px; background: #f1f5f9; word-break: break-word; font-size: 15px; }
    .msg.mine .bubble { background: #1f6feb; color: #fff; }
    .bubble img { display: block; max-width: 100%; max-height: 260px; border-radius: 10px; margin-bottom: 4px; }
    .meta { font-size: 11px; opacity: 0.75; margin-top: 4px; text-align: right; }
    .chat-error { color: #b91c1c; font-size: 13px; padding: 0 16px; min-height: 0; }
    .chat-form { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid #e5e7eb; }
    .chat-form[hidden] { display: none; }
    .chat-form input[type="text"] { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 20px; font-size: 16px; }
    .chat-form button { padding: 10px 16px; border: 0; border-radius: 20px; background: #1f6feb; color: #fff; font-size: 15px; }
    .chat-form button:disabled { opacity: 0.5; }
    .photo-btn { font-size: 22px; cursor: pointer; padding: 4px; }
    .chat-note { margin: 0; padding: 6px 16px 10px; font-size: 12px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <div class="chat-wrap">
    <header class="chat-head">
      <a id="chatBack" href="index.html">← Back</a>
      <h1 id="chatTitle">Chat</h1>
    </header>

    <p id="chatStatus" class="chat-status">Loading...</p>
    <div id="messages" class="chat-list"></div>
    <div id="chatError" class="chat-error"></div>

    <form id="chatForm" class="chat-form" hidden>
      <label class="photo-btn" for="photoInput">📷</label>
      <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" hidden>
      <input type="text" id="chatInput" maxlength="1000" placeholder="Type a message" autocomplete="off">
      <button type="submit" id="sendBtn">Send</button>
    </form>

    <p class="chat-note">Private between you and this business. Links and email addresses are not allowed.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
