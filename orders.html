<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My orders | City Plug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "DM Sans", sans-serif; background: #f6f6f4; color: #1c1c1c; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .back { display: inline-block; margin-bottom: 8px; color: #555; text-decoration: none; font-size: 14px; }
  h1 { margin: 4px 0 4px; font-size: 24px; }
  .sub { margin: 0 0 16px; color: #666; font-size: 14px; }
  #status { color: #666; font-size: 14px; margin: 12px 0; }

  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .top h2 { margin: 0; font-size: 17px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: #eee; color: #444; }
  .pill.paid { background: #fff3d6; color: #8a5a00; }
  .pill.shipped { background: #dcebff; color: #0b4a9e; }
  .pill.received { background: #dcf5e4; color: #146c36; }
  .pill.cancelled { background: #fde0e0; color: #9b1c1c; }
  .meta { margin: 4px 0 12px; font-size: 13px; color: #666; }

  .steps { list-style: none; display: flex; gap: 6px; margin: 0 0 10px; padding: 0; }
  .steps li { flex: 1; font-size: 12px; color: #999; border-top: 4px solid #e2e2e2; padding-top: 6px; }
  .steps li.done { color: #1c1c1c; border-top-color: #1f9d55; }
  .steps li small { display: block; color: #888; font-size: 11px; }

  .hint { margin: 0 0 12px; font-size: 14px; color: #444; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; padding: 12px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn-chat { background: #1c1c1c; color: #fff; position: relative; }
  .btn-receive { background: #1f9d55; color: #fff; }
  .btn-receive.armed { background: #c47a00; }
  .actions button:disabled { opacity: .5; }
  .badge { display: inline-block; min-width: 20px; padding: 1px 6px; margin-left: 6px; border-radius: 999px; background: #e53935; color: #fff; font-size: 12px; }

  /* Report an issue button (under the order card actions) */
  .btn-report { display: block; width: 100%; margin-top: 8px; padding: 10px; border: 1px solid #d8d8d8; border-radius: 10px; background: #fff; color: #9b1c1c; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-report.has { color: #0b4a9e; }

  /* Chat + complaint panels (full screen) */
  #chat, #complaint { position: fixed; inset: 0; background: #f6f6f4; display: none; flex-direction: column; z-index: 10; height: 100dvh; }
  #chat.show, #complaint.show { display: flex; }
  #complaint { z-index: 11; }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #e4e4e4; }
  .chat-head button { border: 0; background: none; font-size: 22px; cursor: pointer; padding: 0 6px; }
  .chat-head strong { display: block; font-size: 16px; }
  .chat-head span { font-size: 12px; color: #777; }
  #chatMsgs, #cpMsgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 15px; line-height: 1.35; word-wrap: break-word; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: #1c1c1c; color: #fff; border-bottom-right-radius: 4px; }
  .msg.them { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .msg img { display: block; max-width: 100%; border-radius: 10px; margin-bottom: 4px; }
  .msg small { display: block; margin-top: 2px; font-size: 11px; opacity: .65; text-align: right; }
  .msg .who { display: block; font-size: 12px; font-weight: 700; margin-bottom: 2px; color: #0b4a9e; }
  .empty { margin: auto; color: #888; font-size: 14px; text-align: center; }
  #chatNotice { padding: 10px 14px; background: #fff3d6; color: #6b4600; font-size: 13px; text-align: center; display: none; }
  #cpIntro { padding: 12px 14px; background: #fff3d6; color: #6b4600; font-size: 14px; }
  #chatErr, #cpErr { padding: 0 14px; color: #b3261e; font-size: 13px; min-height: 0; }
  #chatForm, #cpForm { display: flex; gap: 8px; align-items: flex-end; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #e4e4e4; }
  #chatText, #cpText { flex: 1; resize: none; border: 1px solid #ddd; border-radius: 12px; padding: 10px; font: inherit; font-size: 16px; max-height: 110px; }
  .icon-btn { border: 0; background: #eee; border-radius: 12px; width: 44px; height: 44px; font-size: 20px; cursor: pointer; }
  #chatSend, #cpSend { border: 0; background: #1c1c1c; color: #fff; border-radius: 12px; height: 44px; padding: 0 16px; font: inherit; font-weight: 700; cursor: pointer; }
  #chatSend:disabled, #cpSend:disabled { opacity: .5; }
  #photoName { font-size: 12px; color: #555; padding: 0 14px 6px; background: #fff; display: none; }
</style>
</head>
<body>

<main>
  <a class="back" href="index.html">&larr; Home</a>
  <h1>My orders</h1>
  <p class="sub">Orders you have paid for. Confirm delivery and chat with the business here.</p>
  <p id="status">Loading your orders...</p>
  <div id="list"></div>
</main>

<!-- Chat for one order -->
<section id="chat" aria-label="Order chat">
  <div class="chat-head">
    <button type="button" id="chatClose" aria-label="Close chat">&larr;</button>
    <div>
      <strong id="chatTitle"></strong>
      <span id="chatSub"></span>
    </div>
  </div>
  <div id="chatMsgs"></div>
  <div id="chatNotice"></div>
  <div id="chatErr"></div>
  <div id="photoName"></div>
  <form id="chatForm">
    <label class="icon-btn" for="chatPhoto" style="display:flex;align-items:center;justify-content:center;" title="Send a picture">&#128247;</label>
    <input type="file" id="chatPhoto" accept="image/*" hidden>
    <textarea id="chatText" rows="1" maxlength="1000" placeholder="Type a message (no links)"></textarea>
    <button type="submit" id="chatSend">Send</button>
  </form>
</section>

<!-- Report an issue (complaint) for one order. Never becomes read-only. -->
<section id="complaint" aria-label="Report an issue">
  <div class="chat-head">
    <button type="button" id="cpClose" aria-label="Close">&larr;</button>
    <div>
      <strong id="cpTitle"></strong>
      <span id="cpSub"></span>
    </div>
  </div>
  <div id="cpIntro">Tell us what went wrong with this order. Our team will read it and reply here.</div>
  <div id="cpMsgs"></div>
  <div id="cpErr"></div>
  <form id="cpForm">
    <textarea id="cpText" rows="1" maxlength="1000" placeholder="Describe the problem..."></textarea>
    <button type="submit" id="cpSend">Submit</button>
  </form>
</section>

<!-- Use the same script lines that business.html uses (Supabase library, then config.js) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="orders.js"></script>
</body>
</html>
