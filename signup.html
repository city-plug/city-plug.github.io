<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="City Plug">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <p class="sub">Sign up to create your business page.</p>

    <form id="signup-form">
      <label for="full-name">Full name</label>
      <input type="text" id="full-name" required><br>

      <label for="email">Email</label>
      <input type="email" id="email" required><br>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="new-password" required><br>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" required><br>

      <label for="role">I am signing up as</label>
      <select id="role" required>
        <option value="customer">A customer</option>
        <option value="owner">A business owner</option>
      </select><br>

      <button type="submit" id="submit-btn">Sign up</button>
      <div id="message"></div>
    </form>

    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="password-rules.js"></script>
<script src="return-to.js"></script>
<script src="site-url.js"></script>
<script src="signup.js"></script>
