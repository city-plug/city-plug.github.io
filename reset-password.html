<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="City Plug">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
  <div class="card">
    <h1>Choose a new password</h1>
    <p class="sub" id="intro">Checking your reset link...</p>

    <form id="reset-form" style="display:none">
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" required><br>

      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" autocomplete="new-password" required><br>

      <button type="submit" id="submit-btn">Save new password</button>
    </form>

    <div id="message"></div>

    <p class="switch"><a href="login.html">Back to log in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="password-rules.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
